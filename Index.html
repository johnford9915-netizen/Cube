
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Controlled 3D Cube</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080d1b;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow: hidden;
}

h1 {
  color: #36c5ff;
  margin-top: 35px;
}
  

.scene {
  width: 180px;
  height: 180px;
  perspective: 800px;
  margin: 100px auto 55px;
}

.cube {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transform: rotateX(-20deg) rotateY(30deg);
}

.face {
  position: absolute;
  width: 180px;
  height: 180px;
  border: 2px solid white;
  background: rgba(0,150,255,.65);
  box-shadow: inset 0 0 30px #00aaff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 35px;
  font-weight: bold;
}

.front { transform: translateZ(90px); }
.back { transform: rotateY(180deg) translateZ(90px); }
.right { transform: rotateY(90deg) translateZ(90px); }
.left { transform: rotateY(-90deg) translateZ(90px); }
.top { transform: rotateX(90deg) translateZ(90px); }
.bottom { transform: rotateX(-90deg) translateZ(90px); }

button {
  background: #008cff;
  color: white;
  border: none;
  padding: 14px 24px;
  border-radius: 10px;
  font-size: 16px;
  margin: 10px;
}

#status {
  color: #36c5ff;
  margin: 15px;
}

#camera {
  width: 150px;
  border-radius: 12px;
  transform: scaleX(-1);
  border: 2px solid #36c5ff;
}

.instructions {
  color: #b7c7da;
  font-size: 13px;
  padding: 10px;
}
</style>
</head>

<body>

<h1>HAND CONTROLLED CUBE</h1>

<div class="scene">
  <div class="cube" id="cube">
    <div class="face front">1</div>
    <div class="face back">2</div>
    <div class="face right">3</div>
    <div class="face left">4</div>
    <div class="face top">5</div>
    <div class="face bottom">6</div>
  </div>
</div>

<button onclick="startCamera()">START HAND TRACKING</button>

<p id="status">Camera not started</p>

<video id="camera" autoplay playsinline muted></video>

<div class="instructions">
  Pinch thumb and index finger to grab the cube.<br>
  Move your hand to rotate it. Release to let go.
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
const cube = document.getElementById("cube");
const video = document.getElementById("camera");
const statusText = document.getElementById("status");

let rotationX = -20;
let rotationY = 30;
let grabbing = false;
let previousX = null;
let previousY = null;
let camera = null;

function updateCube() {
  cube.style.transform =
    `rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;
}

const hands = new Hands({
  locateFile: (file) =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 1,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.7
});

hands.onResults((results) => {
  if (!results.multiHandLandmarks ||
      results.multiHandLandmarks.length === 0) {
    grabbing = false;
    previousX = null;
    previousY = null;
    statusText.textContent = "Show your hand to the camera";
    return;
  }

  const hand = results.multiHandLandmarks[0];

  const thumb = hand[4];
  const index = hand[8];

  const distance = Math.hypot(
    thumb.x - index.x,
    thumb.y - index.y
  );

  const pinch = distance < 0.065;

  const x = (thumb.x + index.x) / 2;
  const y = (thumb.y + index.y) / 2;

  if (pinch) {
    statusText.textContent = "GRABBED! Move your hand to rotate.";

    if (previousX !== null) {
      rotationY += (x - previousX) * 400;
      rotationX -= (y - previousY) * 400;
      updateCube();
    }

    previousX = x;
    previousY = y;
    grabbing = true;

  } else {
    statusText.textContent = "Hand detected — pinch to grab";
    previousX = null;
    previousY = null;
    grabbing = false;
  }
});

async function startCamera() {
  try {
    statusText.textContent = "Starting camera...";

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      throw new Error("Camera requires a secure HTTPS website.");
    }

    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width: 640,
        height: 480
      }
    });

    video.srcObject = stream;
    await video.play();

    camera = new Camera(video, {
      onFrame: async () => {
        await hands.send({image: video});
      },
      width: 640,
      height: 480
    });

    camera.start();
    statusText.textContent = "Camera on — show your hand!";

  } catch (error) {
    statusText.textContent = "Camera error: " + error.message;
  }
}
</script>

</body>
</html>
