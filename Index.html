
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Hand Tracking Cube</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080b13;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
  touch-action: none;
}

#app {
  width: 100vw;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

header {
  text-align: center;
  padding: 16px 10px 8px;
}

h1 {
  font-size: 23px;
  margin: 0;
  letter-spacing: 2px;
}

#status {
  color: #54eaff;
  font-size: 13px;
  margin-top: 8px;
}

#scene {
  flex: 1;
  min-height: 0;
  position: relative;
  overflow: hidden;
}

#scene canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#camera {
  position: absolute;
  width: 120px;
  height: 160px;
  right: 12px;
  bottom: 12px;
  object-fit: cover;
  transform: scaleX(-1);
  border: 2px solid #54eaff;
  border-radius: 12px;
  opacity: .8;
  background: #111;
}

#start {
  background: #54eaff;
  color: #07101a;
  font-weight: bold;
  font-size: 17px;
  border: none;
  border-radius: 14px;
  padding: 15px;
  margin: 12px 20px;
}

#instructions {
  text-align: center;
  padding: 8px 12px 18px;
  color: #aab8cc;
  font-size: 13px;
  line-height: 1.6;
}

#reset {
  position: absolute;
  top: 12px;
  left: 12px;
  padding: 10px 14px;
  border: 1px solid #54eaff;
  background: #101827;
  color: white;
  border-radius: 10px;
  z-index: 2;
}
</style>
</head>

<body>
<div id="app">

<header>
  <h1>HOLOGRAM CUBE</h1>
  <div id="status">Ready to start</div>
</header>

<div id="scene">
  <button id="reset">RESET CUBE</button>
  <video id="camera" autoplay playsinline muted></video>
</div>

<button id="start">START HAND TRACKING</button>

<div id="instructions">
  ✋ Show your hand to the camera<br>
  🤏 Pinch your thumb and index finger to grab<br>
  🔄 Move your hand to rotate the cube<br>
  ✋ Release your fingers to let go<br>
  👆 You can also drag the cube with your finger
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ELEMENTS

const sceneElement = document.getElementById('scene');
const video = document.getElementById('camera');
const status = document.getElementById('status');
const startButton = document.getElementById('start');
const resetButton = document.getElementById('reset');

// THREE.JS SCENE

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080b13);

const camera = new THREE.PerspectiveCamera(
  45,
  1,
  0.1,
  100
);

camera.position.z = 6;

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

sceneElement.appendChild(renderer.domElement);

// LIGHTS

scene.add(new THREE.AmbientLight(0xffffff, 1.2));

const light = new THREE.PointLight(
  0x54eaff,
  35,
  100
);

light.position.set(3, 4, 5);
scene.add(light);

const light2 = new THREE.PointLight(
  0x6633ff,
  20,
  100
);

light2.position.set(-3, -3, 4);
scene.add(light2);

// CUBE

const cube = new THREE.Group();
scene.add(cube);

const geometry = new THREE.BoxGeometry(1.7, 1.7, 1.7);

const material = new THREE.MeshStandardMaterial({
  color: 0x101c36,
  metalness: 0.65,
  roughness: 0.2
});

const solidCube = new THREE.Mesh(geometry, material);
cube.add(solidCube);

// Neon edges

const edges = new THREE.EdgesGeometry(geometry);

const edgeMaterial = new THREE.LineBasicMaterial({
  color: 0x54eaff,
  linewidth: 2
});

const wireframe = new THREE.LineSegments(
  edges,
  edgeMaterial
);

cube.add(wireframe);

// EXTRA GLOW EFFECT

const outerGeometry = new THREE.BoxGeometry(1.76, 1.76, 1.76);

const outerMaterial = new THREE.MeshBasicMaterial({
  color: 0x54eaff,
  wireframe: true,
  transparent: true,
  opacity: 0.18
});

cube.add(new THREE.Mesh(outerGeometry, outerMaterial));

// FLOOR GRID

const grid = new THREE.GridHelper(
  12,
  30,
  0x245a85,
  0x14243c
);

grid.position.y = -2.3;
scene.add(grid);

// RESIZE

function resize() {
  const width = sceneElement.clientWidth;
  const height = sceneElement.clientHeight;

  camera.aspect = width / height;
  camera.position.z = width < 500 ? 7 : 6;
  camera.updateProjectionMatrix();

  renderer.setSize(width, height);
}

window.addEventListener('resize', resize);
resize();

// HAND TRACKING

let hands = null;
let stream = null;
let tracking = false;
let processing = false;
let pinching = false;

let previousX = null;
let previousY = null;

let handX = 0;
let handY = 0;

// PINCH DETECTION

function distance(a, b) {
  return Math.hypot(
    a.x - b.x,
    a.y - b.y
  );
}

function onHandResults(results) {

  if (
    !results.multiHandLandmarks ||
    results.multiHandLandmarks.length === 0
  ) {
    pinching = false;
    previousX = null;
    previousY = null;

    status.textContent = 'Show your hand to the camera';
    return;
  }

  const hand = results.multiHandLandmarks[0];

  // Thumb tip = 4
  // Index fingertip = 8

  const thumb = hand[4];
  const index = hand[8];

  // Wrist = 0

  const wrist = hand[0];

  const pinchDistance = distance(thumb, index);

  const isPinching = pinchDistance < 0.055;

  const x = 1 - wrist.x;
  const y = wrist.y;

  if (isPinching) {

    if (!pinching) {
      previousX = x;
      previousY = y;
    }

    if (previousX !== null) {

      const movementX = x - previousX;
      const movementY = y - previousY;

      cube.rotation.y += movementX * 7;
      cube.rotation.x += movementY * 7;
    }

    previousX = x;
    previousY = y;

    status.textContent = 'CUBE GRABBED ✊';

  } else {

    status.textContent = 'HAND DETECTED - PINCH TO GRAB';

    previousX = null;
    previousY = null;
  }

  pinching = isPinching;

  handX = x;
  handY = y;
}

// START CAMERA

async function startTracking() {

  try {

    status.textContent = 'Starting camera...';

    startButton.disabled = true;
    startButton.textContent = 'STARTING...';

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      throw new Error('Camera requires HTTPS. Open your published GitHub Pages website.');
    }

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: 'user',
        width: { ideal: 640 },
        height: { ideal: 480 }
      }
    });

    video.srcObject = stream;
    await video.play();

    if (!window.Hands) {
      throw new Error('Hand tracking library did not load. Check your internet connection.');
    }

    hands = new window.Hands({
      locateFile: (file) =>
        `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });

    hands.onResults(onHandResults);

    tracking = true;

    startButton.textContent = 'HAND TRACKING ACTIVE';
    status.textContent = 'Show your hand to the camera';

    processVideo();

  } catch (error) {

    console.error(error);

    status.textContent = error.message;

    startButton.disabled = false;
    startButton.textContent = 'TRY AGAIN';

  }
}

// CAMERA PROCESSING LOOP

async function processVideo() {

  if (!tracking) return;

  if (video.readyState >= 2 && !processing) {

    processing = true;

    try {
      await hands.send({ image: video });
    } catch (error) {
      console.error(error);
    }

    processing = false;
  }

  if (tracking) {
    requestAnimationFrame(processVideo);
  }
}

// TOUCHSCREEN BACKUP

let touchStartX = 0;
let touchStartY = 0;
let dragging = false;

renderer.domElement.addEventListener('pointerdown', (event) => {

  dragging = true;

  touchStartX = event.clientX;
  touchStartY = event.clientY;

  renderer.domElement.setPointerCapture(event.pointerId);

});

renderer.domElement.addEventListener('pointermove', (event) => {

  if (!dragging) return;

  const dx = event.clientX - touchStartX;
  const dy = event.clientY - touchStartY;

  cube.rotation.y += dx * 0.008;
  cube.rotation.x += dy * 0.008;

  touchStartX = event.clientX;
  touchStartY = event.clientY;

});

renderer.domElement.addEventListener('pointerup', () => {
  dragging = false;
});

renderer.domElement.addEventListener('pointercancel', () => {
  dragging = false;
});

// RESET

resetButton.addEventListener('click', () => {

  cube.rotation.set(0, 0, 0);

  status.textContent = tracking
    ? 'Cube reset - pinch to grab'
    : 'Cube reset';

});

// START BUTTON

startButton.addEventListener('click', startTracking);

// ANIMATION

function animate() {

  requestAnimationFrame(animate);

  if (!pinching && !dragging) {
    cube.rotation.y += 0.0015;
  }

  renderer.render(scene, camera);

}

animate();

</script>
</body>
</html>
